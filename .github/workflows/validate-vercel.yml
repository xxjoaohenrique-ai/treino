name: Validate Vercel backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check artifacts/shape-together/server.js
          node --check 'api/[...path].js'
      - name: Validate Vercel config
        run: python -m json.tool vercel.json > /dev/null
